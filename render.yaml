services:
  - type: web
    name: sultan-shop-management2
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DB_POOL_MIN
        value: "1"
      - key: DB_POOL_MAX
        value: "5"
      - key: SULTAN_COOKIE_SECURE
        value: "1"
      - key: SULTAN_SECRET_KEY
        generateValue: true
      - key: SULTAN_INITIAL_ADMIN_PASSWORD
        sync: false
